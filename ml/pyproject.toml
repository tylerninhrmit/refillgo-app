[project]
name = "refillgo-ml"
version = "0.1.0"
description = "RefillGo kiosk recogniser: export / fine-tune YOLO models for PET bottle vs aluminium can"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ultralytics>=8.3,<9",
  "onnx>=1.16",
  "onnxruntime>=1.20",
  "onnxslim",
  "opencv-python>=4.10",
  "huggingface_hub>=0.25",
  "numpy",
  "pyyaml",
]

[tool.uv]
package = false
